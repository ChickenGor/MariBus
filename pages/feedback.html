<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback - MariBus</title><link rel="stylesheet" href="/static/pages.css"></head>
<body><div class="page"><header class="top"><a class="back" href="/" aria-label="Back to map">&lsaquo;</a><span class="brand">MARIBUS</span></header><main class="content"><section class="hero"><p class="eyebrow">Help us improve</p><h1>User feedback</h1><p>Found incorrect route data or have an idea for MariBus? Tell us about it.</p></section>
<form id="feedback-form" class="card stack" enctype="multipart/form-data">
  <label>Topic<select id="feedback-topic" name="topic" class="field" required><option>Route or stop information</option><option>Live bus tracking</option><option>App experience</option><option>Other</option></select></label>
  <label>Email address <span class="optional">(optional)</span><input name="reply_email" class="field" type="email" autocomplete="email" placeholder="So we can reply to you"></label>
  <label>Your feedback<textarea name="message" class="field" rows="6" minlength="10" maxlength="4000" placeholder="Describe what happened or what you would improve" required></textarea></label>
  <label class="upload-field"><span>Add a screenshot <span class="optional">(optional, max 5 MB)</span></span><input id="feedback-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><span id="feedback-photo-name" class="upload-name">Choose photo</span></label>
  <input class="feedback-honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button id="feedback-submit" class="button" type="submit">Send feedback</button>
  <p id="feedback-message" class="auth-message" role="status" aria-live="polite"></p>
</form></main><footer class="footer">&copy; 2026 Chicken Rice Developer Studio</footer></div><script src="/static/pages.js"></script></body></html>
